<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP_SOURCE}} 'unsafe-inline'; script-src {{CSP_SOURCE}} 'unsafe-inline';">
    <title>Rewrite Rule Editor</title>
    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
        }
        h2, h3 {
            margin: 0 0 8px;
            color: var(--vscode-foreground);
        }
        .hidden {
            display: none;
        }
        .hint {
            color: var(--vscode-descriptionForeground);
            margin-bottom: 12px;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .field {
            margin-bottom: 12px;
        }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--vscode-input-border);
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border-radius: 6px;
            padding: 8px;
        }
        .boxes {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .arrow {
            font-size: 20px;
            user-select: none;
            color: var(--vscode-descriptionForeground);
        }
        .slot {
            min-height: 84px;
            border: 1px dashed var(--vscode-descriptionForeground);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8px;
            transition: border-color .15s ease, background-color .15s ease;
            cursor: default;
        }
        .slot.empty {
            background: transparent;
        }
        .slot.filled {
            border-style: solid;
            border-color: var(--vscode-focusBorder);
            background: var(--vscode-editor-inactiveSelectionBackground);
            cursor: pointer;
        }
        .slot.dragover {
            border-color: var(--vscode-focusBorder);
            background: var(--vscode-list-hoverBackground);
        }
        .slot-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 6px;
            color: var(--vscode-descriptionForeground);
        }
        .slot-value {
            font-weight: 600;
            word-break: break-word;
        }
        .drop-help {
            margin-top: 6px;
            font-size: 11px;
            color: var(--vscode-descriptionForeground);
        }
        button {
            width: 100%;
            border: 1px solid var(--vscode-button-border);
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
        }
        button:hover {
            background: var(--vscode-button-hoverBackground);
        }
        button:disabled {
            opacity: 0.55;
            cursor: default;
            background: var(--vscode-button-secondaryBackground);
            color: var(--vscode-disabledForeground);
        }
    </style>
</head>
<body>
    <div id="empty-state" class="hint">Click + on a rule set to create a rule.</div>
    <div id="editor" class="hidden">
        <h2 id="mode-title">New Rule</h2>
        <div class="field">
            <input id="rule-name" type="text" placeholder="Rule name" />
        </div>
        <div class="boxes">
            <div id="left-slot" class="slot empty">
                <div class="slot-title">Redex</div>
                <div class="slot-value">Drop bigraph here</div>
                <div class="drop-help">Drag from Bigraphs tree</div>
            </div>
            <div class="arrow">→</div>
            <div id="right-slot" class="slot empty">
                <div class="slot-title">Reactum</div>
                <div class="slot-value">Drop bigraph here</div>
                <div class="drop-help">Drag from Bigraphs tree</div>
            </div>
        </div>
        <button id="save-btn" type="button">Save</button>
    </div>
    <script>{{SCRIPT_CONTENT}}</script>
</body>
</html>
