<div data-section="popp-elements">
    <div class="bp-section-hdr">
        <span class="bp-section-title">Problem-oriented Project Planning</span>
    </div>
    <div class="bp-section-content">
        <div class="popp-card-grid">
            <div class="popp-card" data-popp-type="popp:problem" data-node-type="PROBLEM" title="Problem">
                <div class="popp-card-icon"><span class="codicon codicon-warning"></span></div>
                <div class="popp-card-name">Problem</div>
            </div>
            <div class="popp-card" data-popp-type="popp:goal" data-node-type="GOAL" title="Goal">
                <div class="popp-card-icon"><span class="codicon codicon-target"></span></div>
                <div class="popp-card-name">Goal</div>
            </div>
            <div class="popp-card" data-popp-type="popp:consequence" data-node-type="CONSEQUENCE" title="Consequence">
                <div class="popp-card-icon"><span class="codicon codicon-symbol-event"></span></div>
                <div class="popp-card-name">Consequence</div>
            </div>
            <div class="popp-card" data-popp-type="popp:solution" data-node-type="SOLUTION" title="Solution">
                <div class="popp-card-icon"><span class="codicon codicon-lightbulb"></span></div>
                <div class="popp-card-name">Solution</div>
            </div>
            <div class="popp-card" data-popp-type="popp:success_criteria" data-node-type="SUCCESS_CRITERIA" title="Success Criteria">
                <div class="popp-card-icon"><span class="codicon codicon-unverified"></span></div>
                <div class="popp-card-name">Criteria</div>
            </div>
            <div class="popp-card" data-popp-type="popp:success_proof" data-node-type="SUCCESS_PROOF" title="Success Proof">
                <div class="popp-card-icon"><span class="codicon codicon-verified"></span></div>
                <div class="popp-card-name">Proof</div>
            </div>
        </div>
    </div>
</div>
<div data-section="popp-connections">
    <div class="bp-section-hdr">
        <span class="bp-section-title">Connections</span>
    </div>
    <div class="bp-section-content">
        <div class="popp-card-grid">
            <div class="popp-card" data-popp-connect title="Connect two nodes (decomposition or relation)">
                <div class="popp-card-icon"><span class="codicon codicon-plug"></span></div>
                <div class="popp-card-name">Connect</div>
            </div>
        </div>
    </div>
</div>
