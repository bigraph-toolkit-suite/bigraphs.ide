<!--
  POPP variant palette markup. Injected into the palette shell's
  <div data-slot="variant-content"> by POPPVariantPalette.mount().

  Single "POPP Elements" section with a search filter and card grid,
  reusing the .bp-* classes defined in
  ../core/palette/bigraph-variant.css (imported by index.ts).
-->
<div data-section="popp-elements">
    <div class="bp-section-hdr">
        <span class="bp-section-title">POPP Elements</span>
    </div>
    <div class="bp-search-wrap bp-search-under-place">
        <span class="codicon codicon-search bp-search-icon"></span>
        <input type="text" class="bp-search-field" placeholder="Filter elements…" />
        <div class="bp-search-clear">
            <span class="codicon codicon-close"></span>
        </div>
    </div>
    <div class="bp-section-content" data-content="popp-elements">
        <div class="bp-card-grid">
            <!-- cards injected at runtime -->
        </div>
    </div>
</div>
