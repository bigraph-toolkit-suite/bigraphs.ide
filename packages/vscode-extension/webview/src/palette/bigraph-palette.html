<!--
  Bigraph Custom Palette — generic SHELL skeleton.

  Only invariant elements live here: collapse strip, collapse toggle,
  hero, and mode bar. The variant-specific content (Place/Link Graph +
  Layout for bigraphs, Composites/Leaves/Export for behavior trees, etc.)
  is injected by the active variant palette module into
  <div data-slot="variant-content">.

  Dynamic shell content (cards, chips) is wired up by
  bigraph-custom-palette.ts.
-->

<!-- Collapse strip (icon-only view when palette is collapsed) -->
<div class="bp-collapse-strip">
    <div class="bp-strip-btn" data-action="expand" title="Expand palette">
        <span class="codicon codicon-chevron-right"></span>
    </div>
    <div class="bp-strip-btn" data-action="select" title="Select">
        <span class="codicon codicon-inspect"></span>
    </div>
    <div class="bp-strip-btn" data-action="delete" title="Delete">
        <span class="codicon codicon-trash"></span>
    </div>
    <div class="bp-strip-btn" data-action="reset-view" title="Reset view">
        <span class="codicon codicon-screen-normal"></span>
    </div>
</div>

<!-- Collapse toggle (visible in expanded state) -->
<div class="bp-collapse-toggle" title="Collapse">
    <span class="codicon codicon-chevron-left" style="font-size:12px"></span>
</div>

<!-- Header: hero + mode bar (always visible, variant-agnostic) -->
<div class="bp-header">
    <div class="bp-toolbar-hero" aria-label="Bigraph palette hero">
        <div class="bp-toolbar-hero-svg" aria-hidden="true"></div>
        <div class="bp-toolbar-hero-wordmark">BigraphIDE</div>
    </div>
    <div class="bp-mode-bar">
        <div class="bp-mode-btn bp-active" data-action="select" title="Selection tool">
            <span class="codicon codicon-inspect"></span>
            <span class="bp-mode-label">Select</span>
        </div>
        <div class="bp-mode-btn bp-danger" data-action="delete" title="Delete tool">
            <span class="codicon codicon-trash"></span>
            <span class="bp-mode-label">Delete</span>
        </div>
        <div class="bp-mode-btn" data-action="reset" data-momentary="true" title="Reset viewport">
            <span class="codicon codicon-screen-normal"></span>
            <span class="bp-mode-label">Reset</span>
        </div>
        <div class="bp-mode-btn" data-action="fit" data-momentary="true" title="Fit to screen">
            <span class="codicon codicon-screen-full"></span>
            <span class="bp-mode-label">Fit</span>
        </div>
    </div>
</div>

<!-- Body: variant-supplied content -->
<div class="bp-body">

    <!-- VARIANT SLOT — populated by IVariantPalette.mount(container).
         The host clears this slot whenever the active variant changes
         and re-mounts the next variant palette here. -->
    <div class="bp-variant-slot" data-slot="variant-content"></div>

</div>
